<body>
<div id="app">
  <header class="top">

    <button data-tab="cuentas"><span class="dot"></span><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cuentas</button>
